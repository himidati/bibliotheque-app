<!-- features/books/components/book-list/book-list.component.html -->
@if (isLoading()){
  <app-global-spinner [isLoading]="isLoading()"/>
}

<div class="books-list-container">
  <div class="search-bar-container mb-4">
    <span class="p-input-icon-left w-full">
      <i class="pi pi-search"></i>
      <input
        pInputText
        type="text"
        [formControl]="searchControl"
        placeholder="Rechercher par titre ou auteur..."
        class="w-full"
      />
    </span>
  </div>

  <div class="header">
    <h1>Bibliothèque de livres</h1>
    <p-button (click)="addBook()" class="btn btn-primary">Ajouter</p-button>
  </div>

  @if (filteredBooks$ | async; as books) {
    <div class="books-grid">
      @for (book of books; track book.id) {
        <div class="book-details" (click)="gotToDetail(book.id)">

          <div class="book-info-row">
            <h3 [innerHTML]="book.title | highlight: (searchControl.valueChanges | async)"></h3>
            <p>Par {{ book.author }}</p>
          </div>

          <div class="book-actions">
            <p-button icon="pi pi-pencil" severity="warn" [rounded]="true" [text]="true" (click)="editBook(book, $event)" />
            <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true" (click)="deleteBook(book.id, $event)" />
          </div>

        </div>
      }
    </div>

  @if(booksList().length === 0){
    <div class="empty-state"><p>Aucun livre trouvé</p></div>
  }
  }
</div>

<p-dialog [(visible)]="isDialogVisible" [header]="isEditMode ? 'Modifier le livre' : 'Ajouter un livre'">
  <app-book-form [bookForm]="bookForm" (save)="onSave()" (cancel)="onCancel()"/>
</p-dialog>
